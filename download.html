<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Děkujeme! Zde je tvůj PDF</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .success-container {
            text-align: center;
            padding: 60px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.1) 0%, rgba(196, 30, 58, 0.05) 100%);
        }
        .success-content {
            background: white;
            padding: 60px 40px;
            border-radius: 12px;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #d4a574 0%, #c41e3a 100%);
            color: white;
            padding: 18px 50px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 30px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(212, 165, 116, 0.3);
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(196, 30, 58, 0.3);
        }
        .download-btn:active {
            transform: translateY(0);
        }
        .footer-text {
            margin-top: 30px;
            font-size: 0.9rem;
            opacity: 0.7;
            color: #999;
        }
        .back-link {
            margin-top: 20px;
        }
        .back-link a {
            color: #d4a574;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-content">
            <div class="success-icon">✅</div>
            
            <h1>Platba byla úspěšná!</h1>
            
            <p>Děkujeme za nákup MindCurrency PDF.</p>
            <p>Tvůj soubor je připraven ke stažení.</p>
            
            <a href="files/mindcurrency.pdf" download="MindCurrency.pdf" class="download-btn">
                📥 Stáhnout PDF
            </a>
            
            <div class="footer-text">
                <p>✉️ PDF si také poslali na tvůj email.</p>
                <p>Pokud se ti PDF nestáhlo, klikni na tlačítko výše.</p>
            </div>
            
            <div class="back-link">
                <a href="https://mc-site.github.io/mindcurrency-ebook/">← Zpět na stránku</a>
            </div>
        </div>
    </div>
</body>
</html>
